name: Build Releases

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-windows-console:
    name: Build Windows Console EXE
    runs-on: windows-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python installieren
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: EXE bauen
        run: |
          pyinstaller --onefile --name emwsmd --clean --exclude-module tkinter --exclude-module unittest --exclude-module test emwsmd.py

      - name: Windows Paket zippen
        run: |
          copy README.md dist\README.txt
          cd dist
          powershell Compress-Archive -Path emwsmd.exe,README.txt -DestinationPath emwsmd_windows.zip

      - name: Windows Release Asset hochladen
        uses: softprops/action-gh-release@v2
        with:
          files: dist/emwsmd_windows.zip

  build-macos-console:
    name: Build macOS Console App
    runs-on: macos-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python installieren
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: macOS Binary bauen
        run: |
          pyinstaller --onefile --name emwsmd --clean --exclude-module tkinter --exclude-module unittest --exclude-module test emwsmd.py

      - name: macOS Launcher erstellen
        run: |
          mv dist/emwsmd dist/emwsmd
          echo '#!/bin/bash' > dist/run-emwsmd.command
          echo 'cd "$(dirname "$0")"' >> dist/run-emwsmd.command
          echo './emwsmd' >> dist/run-emwsmd.command
          chmod +x dist/run-emwsmd.command

      - name: macOS Paket zippen
        run: |
          cp README.md dist/README.txt
          cd dist
          zip -r emwsmd_macos.zip emwsmd run-emwsmd.command README.txt

      - name: macOS Release Asset hochladen
        uses: softprops/action-gh-release@v2
        with:
          files: dist/emwsmd_macos.zip

  build-windows-gui:
    name: Build Windows GUI EXE
    runs-on: windows-latest
    env:
      APP_NAME: emwsmd-gui
      SYSTEM: windows
      ENTRY_FILE: emwsmd_gui.py

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python installieren
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_gui.txt
          pip install pyinstaller

      - name: GUI EXE bauen
        run: |
          pyinstaller --onefile --windowed --name emwsmd-gui --clean --exclude-module tkinter --exclude-module unittest --exclude-module test emwsmd_gui.py

      - name: Windows GUI Paket zippen
        run: |
          if (Test-Path README-GUI.md) {
            Copy-Item README-GUI.md dist\README-GUI.txt
          }
          cd dist
          powershell Compress-Archive -Path emwsmd-gui.exe,README-GUI.txt -DestinationPath emwsmd-gui_windows.zip

      - name: Windows GUI Release Asset hochladen
        uses: softprops/action-gh-release@v2
        with:
          files: dist/emwsmd-gui_windows.zip

  build-macos-gui:
    name: Build macOS GUI App
    runs-on: macos-latest
    env:
      APP_NAME: emwsmd-gui
      SYSTEM: macos
      ENTRY_FILE: emwsmd_gui.py

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python installieren
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_gui.txt
          pip install "pyinstaller==6.10.0"

      - name: macOS GUI Binary bauen
        run: |
          pyinstaller --onefile --windowed --name emwsmd-gui --clean --exclude-module tkinter --exclude-module unittest --exclude-module test --codesign-identity "" emwsmd_gui.py

      - name: macOS GUI Launcher erstellen
        run: |
          mv "dist/emwsmd-gui" "dist/emwsmd-gui"
          echo '#!/bin/bash' > dist/run-emwsmd-gui.command
          echo 'cd "$(dirname "$0")"' >> dist/run-emwsmd-gui.command
          echo './emwsmd-gui' >> dist/run-emwsmd-gui.command
          chmod +x dist/run-emwsmd-gui.command

      - name: macOS GUI Paket zippen
        run: |
          if [ -f README-GUI.md ]; then cp README-GUI.md dist/README-GUI.txt; else cp README.md dist/README-GUI.txt; fi
          cd dist
          zip -r emwsmd-gui_macos.zip "$APP_NAME" run-emwsmd-gui.command README-GUI.txt

      - name: macOS GUI Release Asset hochladen
        uses: softprops/action-gh-release@v2
        with:
          files: dist/emwsmd-gui_macos.zip
