name: Build Releases

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-windows-gui:
    name: Build Windows GUI EXE
    runs-on: windows-latest
    env:
      APP_NAME: emwsmd-gui
      SYSTEM: windows
      ENTRY_FILE: emwsmd_gui.py

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python installieren
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: GUI EXE bauen
        run: |
          pyinstaller --onefile --windowed --name emwsmd-gui --clean --exclude-module tkinter --exclude-module unittest --exclude-module test emwsmd_gui.py

      - name: Windows GUI Paket zippen
        run: |
          if (Test-Path README.md) {
            Copy-Item README.md dist\README.md
          }
          cd dist
          powershell Compress-Archive -Path emwsmd-gui.exe,README.md -DestinationPath emwsmd-gui_windows.zip

      - name: Windows GUI Release Asset hochladen
        uses: softprops/action-gh-release@v2
        with:
          files: dist/emwsmd-gui_windows.zip
